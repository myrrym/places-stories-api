stories:
- title: Pinang Peranakan Mansion
  body_md: 'The Pinang Peranakan Mansion (Malay: Rumah Agam Peranakan Pulau Pinang) in George Town, Penang,
    Malaysia, is a museum dedicated to Penang''s Peranakan heritage. The museum itself is housed within
    a distinctive green-hued mansion at Church Street, George Town, which once served as the residence
    and office of a 19th-century Chinese tycoon, Chung Keng Quee.

    The mansion contains thousands of Peranakan artifacts, antiques and collectibles, as well as showcasing
    Peranakan interior design and customs, such as the typical grand long dining table (Malay: tok panjang).
    Due to its unique architecture and interior design that reflect the lifestyles of the Peranakans in
    Penang, the mansion has been featured in television series and reality TV shows, such as The Little
    Nyonya, The Amazing Race and The Amazing Race Asia.'
