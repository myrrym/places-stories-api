stories:
- title: Langkawi Cable Car
  body_md: 'The Langkawi Cable Car, also known as Langkawi SkyCab, is a gondola lift and one of the major
    attractions in Langkawi Island, Kedah, Malaysia. It provides an aerial link from the Oriental Village
    at Teluk Burau to the peak of Gunung Machinchang, which is also the location of the Langkawi Sky Bridge.
    The total length is 2.2 km (1.4 mi), with a journey time from the base to the top of around 15 minutes.
    It was officially opened in 2003.

    Langkawi Cable Car is located just north of Telaga Harbour, Pantai Kok, with the entrance within ''Oriental
    Village'' at the foothill of the Mat Chincang mountain range. It is located to the north-west of the
    Langkawi International Airport, on the west coast of the main island of Langkawi. It is approximate
    30 minutes drive from Kuah town and 15 minutes drive from Langkawi International Airport.'
