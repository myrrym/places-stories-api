stories:
- title: Jamek Mosque
  body_md: 'Jamek Mosque, officially Sultan Abdul Samad Jamek Mosque (Malay: Masjid Jamek Sultan Abdul
    Samad) is one of the oldest mosques in Kuala Lumpur, Malaysia. It is located at the confluence of
    the Klang and Gombak rivers and may be accessed via Jalan Tun Perak.  The mosque was designed by British
    architect and soldier Arthur Benison Hubback, and built in 1909. It was the principal mosque of Kuala
    Lumpur until the construction of the national mosque Masjid Negara in 1965.

    The name "Jamek" is  the Malay equivalent of the Arabic word jāmiʿ (جامع)  meaning a place where people
    congregate to worship.  It is also referred to as "Friday Mosque" by the locals.'
