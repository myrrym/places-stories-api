stories:
- title: Jonker Walk
  body_md: 'The Jonker Walk (Malay: Persiaran Jonker, Chinese: 鷄場街; pinyin: Jīcháng jiē) is the Chinatown
    area in Malacca City in the state of Malacca, Malaysia located along Jonker Street (Malay: Jalan Hang
    Jebat). It starts from across Malacca River near the Stadthuys, with the street in the area filled
    with historical houses along its left and right sides dating back to the 17th century, many of which
    are shops selling antiques, textiles, foods, handicrafts and souvenirs such as keychains and shirts.
    The area turns into a night market every Friday, Saturday and Sunday in the evening from 6 p.m. until
    12 midnight, with its street blocked for traffic.'
