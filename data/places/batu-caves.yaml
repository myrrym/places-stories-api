- title: Batu Caves
  body_md: Batu Caves are a series of limestone caves in Gombak, Selangor, Malaysia. It is located on
    a 325 m (1,066 ft)–tall mogote, about 13 km (8.1 mi) north of the Malaysian capital of Kuala Lumpur.
    The cave complex contains many Hindu temples, the most popular of which is a shrine dedicated to Murugan,
    and is the focal point of the Tamil Hindu festival of Thaipusam in Malaysia. The complex hosts a 43
    m (141 ft) tall Murugan statue, amongst the tallest Murugan statues in the world.
