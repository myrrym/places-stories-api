- title: Fort Margherita
  body_md: 'Fort Margherita is a fort constructed in 1879 by Charles Brooke, the second Rajah of Sarawak,
    situated in Kuching, Sarawak, Malaysia. The fort is an important landmark and monument in Sarawak''s
    history which goes back to the century-old Brooke dynasty of Sarawak. The fort, built in the style
    of an English castle, was designed to protect Kuching from attacks by pirates. It served as a Police
    Museum from 1971 before being handed over to the Government of Sarawak and now is a tourist attraction
    in Kuching. The fort now houses the Brooke Gallery, an exhibition showcasing the history of Sarawak
    under the Brooke dynasty.

    It is situated across the Sarawak River near The Astana, the official residence of the Yang di-Pertua
    Negeri of Sarawak, and is accessible by road. It is a 15-minute drive along Petra Jaya, or a short
    river cruise from Pangkalan Batu, in front of Main Bazaar on Kuching Waterfront and located next to
    the New Sarawak State Legislative Assembly Building. It is part of the Kuching Heritage Trail.'
