stories:
- title: Petronas Towers
  body_md: 'The Petronas Towers (Malay: Menara Berkembar Petronas), also known as the Petronas Twin Towers
    and colloquially the KLCC Twin Towers, are an interlinked pair of 88-storey supertall skyscrapers
    in Kuala Lumpur, Malaysia, standing at 451.9 m (1,483 ft). From 1998 to 2004, they were the tallest
    buildings in the world until they were surpassed by the Taipei 101 skyscraper in Taiwan. The Petronas
    Towers remain the world''s tallest twin skyscrapers, surpassing the original World Trade Center towers
    in New York City, and were the tallest buildings in Malaysia until 2019, when they were surpassed
    by The Exchange 106. The Petronas Towers are a major landmark of Kuala Lumpur, along with the nearby
    Kuala Lumpur Tower and Merdeka 118, and are visible in many places across the city.'
