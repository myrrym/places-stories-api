stories:
- title: Kuala Lumpur Tower
  body_md: 'The Kuala Lumpur Tower (Malay: Menara Kuala Lumpur; Jawi: منارا کوالا لومڤور), colloquially
    referred to as KL Tower, is a 421-meter-tall (1,381-foot) telecommunication tower in Kuala Lumpur,
    Malaysia. It is the world''s seventh-tallest telecommunication tower. It features an antenna which
    increases its height to 421 metres (1,381 ft). The roof of the pod is at 336.5 metres (1,104 ft).
    The rest of the tower below has a stairwell and an elevator to reach the upper area, which also contains
    a revolving restaurant, providing diners with a panoramic view of the city.

    Races are held annually, where participants race up the stairs to the top. The tower also acts as
    the Islamic falak observatory to observe the crescent moon which marks the beginning of Muslim month
    of Ramadhan, Syawal, and Zulhijjah, to celebrate fasting month of Ramadhan, Hari Raya Aidilfitri and
    Aidiladha. The tower is the highest viewpoint in Kuala Lumpur that is open to the public.'
