stories:
- title: Penang Hill
  body_md: "Penang Hill is a hill resort comprising a group of peaks near the center of Penang Island,\
    \ Malaysia. It is located 9 km (5.6 mi) west of the centre of George Town. Penang Hill is also known\
    \ by the Malay name Bukit Bendera, which actually refers to Flagstaff Hill, the most developed peak.\
    \ One of the peaks is known as Strawberry Hill, which was also the name of a house owned by Francis\
    \ Light, founder of Penang colony.  \nA number of hills make up Penang Hill, with the highest point\
    \ being Western Hill, which stands at an altitude of 833 m (2,733 ft) above sea level. Penang Hill\
    \ is a hilly, forested area that stands out from the lowlands of Malaysia due to its elevation and\
    \ greenery. The area was used as a retreat during the British colonial period and is now a popular\
    \ tourist destination because of its history and heritage.\nThe top of Flagstaff Hill, the most developed\
    \ tourist area, is accessible via the Penang Hill Railway from its base station at Hill Railway Station\
    \ Road. To date, this funicular railway system is the only one of its kind in Malaysia, transporting\
    \ over a million visitors to the top of Penang Hill as of 2014.\nPenang Hill is part of Penang Hill\
    \ Biosphere Reserve, recognized by UNESCO as the third Biosphere Reserve in Malaysia listed in the\
    \ World Network of Biosphere Reserves (WNBR)."
