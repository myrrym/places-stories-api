stories:
- title: Port Dickson
  body_md: 'Port Dickson (Negeri Sembilan Malay: Podeksen), colloquially referred to as PD, is a beach
    resort in Port Dickson District, Negeri Sembilan, Malaysia. It is the second largest urban area in
    the state after Seremban, the state capital. The town''s administration is run by the Port Dickson
    Municipal Council (Malay: Majlis Perbandaran Port Dickson; MPPD), formerly known as the Port Dickson
    Sanitary Board (Malay: Lembaga Kesihatan Port Dickson) from 29 March 1928 until 28 February 1950,
    Port Dickson Town Board (Malay: Lembaga Bandaran Port Dickson) from 1 March 1950 until 30 November
    1979, and Port Dickson District Council (Malay: Majlis Daerah Port Dickson) from 1 December 1979 until
    1 February 2002.'
