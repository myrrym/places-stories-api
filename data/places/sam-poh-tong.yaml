- title: Sam Poh Tong Temple
  body_md: 'The Sam Poh Tong Temple (Chinese: 三寶洞 ''three treasures cave'') (also known as the Three Buddhas
    Cave) is a Chinese temple built within a limestone cave and is the oldest and the main cave temple
    in Ipoh, Perak, Malaysia. The temple was built in a raw limestone cave in the mountains located about
    5 km from the city centre and follows Mahāyāna Buddhism.'
