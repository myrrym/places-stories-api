- title: Redang Island
  body_md: 'Redang Island (Malay: Pulau Redang, Terengganu Malay: Pula Redang) is an island in Kuala Nerus
    District, Terengganu, Malaysia. It is one of the largest islands off the east coast of Peninsular
    Malaysia. It is one of nine islands that make up an eponymous marine sanctuary park offering snorkeling
    and diving opportunities for tourists.'
