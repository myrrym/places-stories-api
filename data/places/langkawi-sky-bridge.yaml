stories:
- title: Langkawi Sky Bridge
  body_md: 'Langkawi Sky Bridge is a 125-metre (410 ft) curved pedestrian cable-stayed bridge in Malaysia,
    completed in 2005. The bridge deck is 660 metres (2,170 ft) above sea level at the peak of Gunung
    Mat Cincang on Pulau Langkawi, the main island of the Langkawi archipelago in Kedah. The Langkawi
    Sky Bridge can be reached by first taking the Langkawi Cable Car to the Top Station, where an inclined
    lift called SkyGlide takes visitors from the Top Station down to the bridge.

    The bridge was closed in July 2012 for maintenance and upgrading. The reopening was put off several
    times, but it partially reopened in February 2015. The bridge is now fully accessible.'
