- title: Cheng Hoon Teng Temple
  body_md: 'The Cheng Hoon Teng Temple (Chinese: 青云亭; Pe̍h-ōe-jī: Chheng-hûn-tîng) (also called as the
    Temple of Green Cloud) is a Chinese temple practising the Three Doctrinal Systems of Buddhism, Confucianism
    and Taoism located at No. 25 Jalan Tokong, Malacca City, Malaysia. It is the oldest functioning temple
    in the country.'
