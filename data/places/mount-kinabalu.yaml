stories:
- title: Mount Kinabalu
  body_md: 'Mount Kinabalu (Dusun: Gayo Ngaran or Nulu Nabalu, Malay: Gunung Kinabalu) is the highest
    mountain in Malaysia and Maritime Southeast Asia, located on the island of Borneo in Sabah. With a
    height of 4,095 metres (13,435 ft), it is the third-highest peak of an island on Earth, the 28th-highest
    peak in Southeast Asia, and 20th-most-prominent mountain in the world. The mountain is located in
    Ranau district, West Coast Division of Sabah, Malaysia. It is protected as Kinabalu Park, a World
    Heritage Site.

    In 1997, a re-survey using satellite technology was conducted. It established Mount Kinabalu had a
    summit (known as Low''s Peak) height of 4,095 m (13,435 ft) above sea level, some 6 m (20 ft) less
    than the hitherto-published figure of 4,101 m (13,455 ft).

    The mountain and its surroundings have high biodiversity, with 5,000 to 6,000 species of plants, 326
    species of birds, and over 100 mammalian species identified. Among this rich collection of wildlife
    are famous species such as the Rafflesia plants and orangutans.

    Low''s Peak can be climbed by a person in good physical condition without mountaineering equipment
    on the main route. However, climbers must be accompanied by accredited guides at all times due to
    national park regulations and the risk of experiencing altitude sickness.'
