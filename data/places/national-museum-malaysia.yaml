- title: National Museum (Malaysia)
  body_md: 'The National Museum (Malay: Muzium Negara) is a public museum in Kuala Lumpur, Malaysia dedicated
    to Malaysian art, culture, and history. Located on Jalan Damansara close to Perdana Lake Gardens across
    KL Sentral station. Its façade comprises elements from both traditional Malay and modern features.
    It was inaugurated on 31 August 1963.

    The National Museum is a three-story structure, 109.7 metres (359 ft 11 in) long and 15.1 metres (49
    ft 6 in) wide, which is 37.6 metres (123 ft 4 in) high at the central point. The museum houses four
    main galleries allotted to ethnology and natural history (geology). The displays range from free-standing
    tableaux showing cultural events like weddings, festivals and costumes; to traditional weapons, musical
    instruments, arts and crafts, ceramics, and flora and fauna.'
