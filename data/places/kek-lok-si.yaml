- title: Kek Lok Si
  body_md: 'The Kek Lok Si Temple (simplified Chinese: 极乐寺; traditional Chinese: 極樂寺) is a Buddhist temple
    in George Town in the Malaysian state of Penang. Located at Ayer Itam, it is the largest Buddhist
    temple in Malaysia and an important pilgrimage centre for Buddhists from Hong Kong, the Philippines,
    Singapore and other parts of Southeast Asia. The entire complex of temples was built over a period
    from 1890 to 1930, an inspirational initiative of Beow Lean, the abbot. The main feature of the complex
    is the seven-story Ten Thousand Buddhas Pagoda commissioned by the late Thai king Rama VI, featuring
    10,000 alabaster and bronze statues of Buddha and the 36.57-metre-tall (120 ft)  bronze statue of
    Guanyin (Kuan Yin), the Goddess of Mercy. The 10,000 Buddhas concept belongs to the Chinese Mahāyāna
    school of Buddhism while Rama VI was king over a Theravāda country and Buddhist tradition.

    Mahayana Buddhism, Theravada Buddhism, and traditional Chinese rituals blend into a harmonious whole,
    both in the temple architecture and artwork as well as in the daily activities of worshippers.'
