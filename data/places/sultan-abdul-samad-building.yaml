stories:
- title: Sultan Abdul Samad Building
  body_md: "The Sultan Abdul Samad Building (Malay: Bangunan Sultan Abdul Samad; Jawi: باڠونن سلطان عبدالصمد)\
    \ is a late-19th-century building located along Jalan Raja in front of Dataran Merdeka and the Royal\
    \ Selangor Club in Kuala Lumpur, Malaysia. The building originally housed the offices of the British\
    \ colonial administration, and was known simply as Government Offices in its early years. In 1974,\
    \ it was renamed after Sultan Abdul Samad, the reigning sultan of Selangor at the time when construction\
    \ began.\nThe building once housed the superior courts of the country: the Federal Court of Malaysia,\
    \ the Court of Appeals and the High Court of Malaya; the Federal Court and the Court of Appeals relocated\
    \ to the Palace of Justice in Putrajaya during the early 2000s, while the High Court of Malaya shifted\
    \ to the Kuala Lumpur Courts Complex in Segambut in 2007. Later, it housed the offices of the Ministry\
    \ of Communications and Multimedia and the Ministry of Tourism and Culture of Malaysia (Malay: Kementerian\
    \ Komunikasi dan Multimedia, Kementerian Pelancongan dan Kebudayaan Malaysia). \nThe building was\
    \ most recently restored in 2026, and contains galleries, exhibition spaces and several cafés."
