stories:
- title: Independence Square (Kuala Lumpur)
  body_md: 'Independence Square (Malay: Dataran Merdeka) is a square located in Kuala Lumpur, Malaysia.
    It is situated in front of the Sultan Abdul Samad Building. It was formerly known as the Selangor
    Club Padang, or simply the Padang (meaning "field" in Malay), and was used as the cricket green of
    the Selangor Club (now the Royal Selangor Club). It was here that the Union Flag was lowered and the
    Malaysian flag hoisted for the first time at midnight on 31 August 1957. Since then, the Independence
    Square has been the usual venue for the annual Independence Day Parade.'
