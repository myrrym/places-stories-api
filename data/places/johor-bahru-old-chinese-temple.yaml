- title: Johor Bahru Old Chinese Temple
  body_md: 'Johor Bahru Old Chinese Temple (Chinese: 柔佛古廟; pinyin: Róufú Gǔmiào; Pe̍h-ōe-jī: Jiû-hut Kó͘-biō)
    known as Old Temple (Chinese: 古廟; pinyin: Gǔmiào; Pe̍h-ōe-jī: Kó͘-biō) by the locals, is a Chinese
    temple located in Johor Bahru, Johor, Malaysia. Located at Jalan Trus, the temple is flanked by modern
    skyscrapers. This temple is one of the oldest structures in the city and has become the symbol of
    unity among the seven Chinese dialect groups namely Teochews, Hoklo (Hokkiens), Cantonese, Hakka,
    Foochowese, Henghua and Hainanese peoples.

    In 2007, a documentary series called My Roots featured the temple in the episode "Grand March with
    the Deities".'
