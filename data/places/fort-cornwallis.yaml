- title: Fort Cornwallis
  body_md: Fort Cornwallis is a bastion fort in George Town, Penang, Malaysia, built by the British East
    India Company in the late 18th century. Named after the then Lieutenant-General The 2nd Earl Cornwallis
    (1738–1805), the Governor-General of Bengal at the time of the fort's construction, it is the largest
    standing fort in Malaysia. The fort was built intended to respond to possible enemy threats during
    the Napoleonic Wars, a threat that in the end never materialised. The tourism fee to enter the fort
    costs RM10 for Malaysians and RM20 for foreigners.
