stories:
- title: Sultan Ibrahim Building
  body_md: 'The Sultan Ibrahim Building (Malay: Bangunan Sultan Ibrahim; Jawi: باڠونن سلطان إبراهيم) is
    a former state secretariat building of Johor. It is located at Bukit Timbalan in Johor Bahru. The
    building was constructed between 1936 and 1939 and was completed in 1940 as the Government of Johor
    attempted to streamline the state''s administration. It was officially opened by the late Sultan Ibrahim
    of Johor.

    It was also the tallest building in Malaya during pre-independence era. In Johor Bahru itself, it
    stood unchallenged as the tallest building in the town until the completion of the Merlin Tower in
    the 1970s.

    The offices of the state secretariat have now moved to Kota Iskandar. There are plans to convert the
    building into a museum.'
