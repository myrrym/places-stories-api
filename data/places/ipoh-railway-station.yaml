stories:
- title: Ipoh railway station
  body_md: 'The Ipoh railway station is a Malaysian train station located in the heart of and named after
    Ipoh, the capital city of the state of Perak. It serves as the main railway terminal for the state.
    Operated by Keretapi Tanah Melayu (KTM), the station is served by several KTM ETS services, and is
    the southern terminus of the KTM Komuter Northern Sector''s Butterworth-Ipoh Line. The station also
    handles freight trains. Although there are nine tracks, only four are electrified and only three of
    the electrified tracks are used for ETS and Komuter services. The remaining six tracks are used by
    freight trains.


    Designed by Arthur Benison Hubback, the current station was officially opened in 1917. Affectionately
    known as the Taj Mahal of Ipoh by its locals, the building also houses a station hotel called the
    Majestic Hotel.'
