- title: Tua Pek Kong Temple, Kuching
  body_md: 'Tua Pek Kong Temple (Chinese: 古晉大伯公廟) (also called as Chong Swee Heng, Chinese: 崇瑞兴) is a
    Chinese temple situated near the waterfront of Kuching, Sarawak, Malaysia, opposite the Chinese History
    Museum. It is the oldest temple in the city and formed a part of the Kuching Heritage Trail.'
