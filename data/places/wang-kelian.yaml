- title: Wang Kelian
  body_md: Wang Kelian is a village in Perlis, Malaysia located on the Malaysia-Thailand border. The village
    was popular with tourists as it was the location of a border market, which straddles both sides of
    the border. However, it has lost it popularity following the discovery of mass graves of the victims
    of human trafficking in the area in 2015, for which it is now known. It is also the location of a
    minor border crossing into Thailand.
