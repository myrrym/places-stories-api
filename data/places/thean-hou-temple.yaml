- title: Thean Hou Temple
  body_md: 'The Thean Hou Temple (Chinese: 乐圣岭天后宫/樂聖嶺天后宮) is a six-tiered temple of the Chinese sea goddess
    Mazu located in Kuala Lumpur, Malaysia. It is located on 1.67 acres (6,758 m2) of land atop Robson
    Heights on Lorong Bellamy, overlooking Jalan Syed Putra. It was completed in 1987 and officially opened
    in 1989. The temple was built by Hainanese living in Malaysia and the property belongs to and is run
    by the Selangor and Federal Territory Hainan Association (Malay: Hainan Selangor dan Wilayah Persekutuan;
    Chinese: 雪隆海南会馆/雪隆海南會館). It is one of the largest temples in Southeast Asia.'
