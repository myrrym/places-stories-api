stories:
- title: Khoo Kongsi
  body_md: 'The Leong San Tong Khoo Kongsi (Chinese: 龍山堂邱公司; Pe̍h-ōe-jī: Liông-san-tông Khu Kong-si),
    or Khoo Kongsi for short, is the largest Hokkien clanhouse in Malaysia, with elaborate and highly
    ornamented architecture, a mark of the dominant presence of the Chinese in Penang, Malaysia. The Khoo
    Kongsi is the grandest clan temple in the country. It is also one of the city''s major historic attractions.
    The clan temple has retained its historic setting, which includes an association building, a traditional
    theatre, and the late 19th century rowhouses for clan members, all clustered around a granite-paved
    square. It is located in Cannon Square in the heart of the oldest part of the city of George Town,
    in the midst of narrow, winding lanes and pre-War houses.'
