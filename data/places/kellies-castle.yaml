stories:
- title: Kellie's Castle
  body_md: Kellie's Castle (sometimes also called Kellie's Folly) is an unfinished castle located in Batu
    Gajah, Kinta District, Perak, Malaysia. The unfinished, ruined mansion was built by the Scottish planter
    William Kellie-Smith. According to differing accounts, it was either a gift for his wife or a home
    for his son. Kellie's Castle is situated beside the Raya River (Sungai Raya), which is a small creek
    to the Kinta River.
