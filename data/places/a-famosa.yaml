stories:
- title: A Famosa
  body_md: 'A Famosa (Portuguese pronunciation: [ɐ faˈmɔzɐ]) was a Portuguese fortress built in Malacca,
    Malaysia, around 1512. The oldest part of the fortress was a five-storey keep which eventually gave
    its name to the fortress as a whole. Some time following the Battle of Malacca (1641) and the occupation
    of the city by the Dutch, the keep was destroyed but the outer walls of the fortress were expanded.
    However, in 1811 the British destroyed all of the original fortress and most of the outer walls. The
    Porta de Santiago gateway, and the rebuilt Middelburg Bastion, are the only parts of the fortress
    that remain today.'
