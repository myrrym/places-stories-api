stories:
- title: Taman Negara
  body_md: "Taman Negara is a national park in Peninsular Malaysia. It was established in 1938 and 1939\
    \ as the King George V National Park after Theodore Hubback lobbied the sultans of Pahang, Terengganu\
    \ and Kelantan to set aside a piece of land that covers the three states for the creation of a protected\
    \ area. After independence, it was renamed Taman Negara, which means \"national park\" in Malay. \n\
    Taman Negara has a total area of 4,343 km2 and it is one of the world's oldest rainforests, estimated\
    \ to be more than 130 million years old. Mount Tahan, Peninsular Malaysia's highest point with an\
    \ elevation of 7,175 ft (2,187 m) above sea level, is within the park's boundaries. Taman Negara is\
    \ an important conservation area for the Peninsular Malaysian rain forest and montane rain forest\
    \ ecoregions, is rich in biodiversity and home to several endangered species such as the Malayan tiger\
    \ and Asian elephant. The park exists on the traditional lands of several Orang Asli groups, such\
    \ as the Batek people, whose use rights are recognised in the park's legislation.\nA popular tourist\
    \ attraction, the park is found near Kuala Tahan (where the Park headquarters for Pahang is located)\
    \ and features a canopy walkway, the Gua Telinga cave system, and the Lata Berkoh rapids. Visitors\
    \ can experience the tropical rainforest, birdwatching, jungle trekking, and the river views along\
    \ the Tahan River, with many local resorts and hotels for visitors located nearby."
