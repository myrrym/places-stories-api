- title: Seri Menanti
  body_md: 'Seri Menanti (Negeri Sembilan Malay: Soghi Monanti or Sonanti) is a town, a mukim, and a state
    assembly constituency in Kuala Pilah District, central Negeri Sembilan, Malaysia, located 33 km (20.5
    m) east of the state capital city of Seremban and 14 km (8.7 m) southwest of Kuala Pilah. It is the
    royal capital of the state of Negeri Sembilan and houses the seat of the ruler of the state of Negeri
    Sembilan, referred to as the Yang Di-Pertuan Besar of Negeri Sembilan or Yamtuan Besar. The royal
    palace is known as Istana Besar (Grand Palace).

    Seri Menanti is situated in a valley surrounded by the verdant rolling hills of the Negri Titiwangsa.
    The area in which Seri Menanti is located is known as the Adat Circle (Malay: Adat Lingkungan). Seri
    Menanti also governs the surrounding chiefdoms (known locally as luak) of Terachi, Gunung Pasir, Ulu
    Muar, Jempol, and Ineh, collectively known as Luak Tanah Mengandung.'
