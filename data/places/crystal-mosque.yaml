- title: Crystal Mosque
  body_md: The Crystal Mosque or Masjid Kristal is a mosque in Wan Man, Kuala Terengganu, Terengganu,
    Malaysia. A grand structure made of steel, glass and crystal, the mosque is located at the Islamic
    Heritage Park on the island of Wan Man. The mosque was constructed between 2006 and 2008, and was
    officially inaugurated on 8 February 2008 by the 13th Yang di-Pertuan Agong, Sultan Mizan Zainal Abidin
    of Terengganu. It has the capacity to accommodate over 1,500 worshipers at a time.
