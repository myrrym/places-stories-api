- title: Zahir Mosque
  body_md: 'The Zahir Mosque (Malay: Masjid Zahir, Kedah Malay: Masjid Zaheq) is a Sunni mosque in Alor
    Setar, Kota Setar, Kedah, Malaysia, and the state mosque of Kedah. Built in British Malaya in 1912,
    the Zahir Mosque is one of the grandest and oldest mosques in Malaysia.'
