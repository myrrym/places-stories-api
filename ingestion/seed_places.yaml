  - { id: kek-lok-si,              name: Kek Lok Si,                      wikipedia_title: Kek Lok Si,                             category: religious, city: Air Itam,        state: Penang }
  - { id: penang-hill,             name: Penang Hill,                     wikipedia_title: Penang Hill,                            category: natural,   city: Air Itam,        state: Penang }

