# Curated seed list for v1.
#
# Deliberately only *names*, not coordinates. `python -m ingestion.build_seed`
# resolves each entry to a Wikidata item and coordinates, pulls the OSM element
# behind it, fetches the Wikipedia lead section as the story, and writes the
# stitched result to data/places/<id>.yaml. Nothing here is hand-measured.
#
# Coverage is spread across 14 states/territories, but clustered 3-6 places per
# town so that a 1 km proximity query returns real neighbours rather than a
# single lonely pin.

places:
  # --- Penang: George Town ---
  - { id: khoo-kongsi,             name: Khoo Kongsi,                     wikipedia_title: Khoo Kongsi,                            category: historic,  city: George Town,     state: Penang }
